<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You have reached john e. parman</title>
    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="index.html">parman</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#portfolio">Portfolio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
<section class="container my-5">
    <h2 class="text-center display-5">Community Gallery</h2>
    <div id="galleryContainer" class="row g-4 mt-4">
        </div>
</section>

<script>
    const container = document.getElementById('galleryContainer');
    const gallery = JSON.parse(localStorage.getItem('myGallery') || '[]');

    if (gallery.length === 0) {
        container.innerHTML = "<p class='text-center'>No drawings yet. Go to contact to create one!</p>";
    }

    gallery.forEach((imageStr, index) => {
        const col = document.createElement('div');
        col.className = "col-12 col-md-4";
        col.innerHTML = `
            <div class="card shadow-sm">
                <img src="${imageStr}" class="card-img-top" alt="Drawing ${index}">
                <div class="card-body text-center">
                    <p class="text-muted small">Local Save #${index + 1}</p>
                </div>
            </div>`;
        container.appendChild(col);
    });
</script>
</body>
</html>
