<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Gallery — John E. Parman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-md sticky-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="index.html">parman</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#portfolio">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Draw</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="drawback.html">Community</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container text-center">
            <h1 class="display-4 fw-bold mb-3">Community Gallery</h1>
            <p class="lead mb-0">
                Drawings submitted by visitors. Each one a small act of creative contact.
            </p>
        </div>
    </header>

    <main class="section-pad">
        <div class="container">
            <div id="galleryContainer" class="row g-4"></div>
            <div class="text-center mt-5">
                <a href="contact.html" class="btn btn-primary btn-lg">Add Your Drawing</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <hr class="border-secondary">
            <div class="row py-3">
                <div class="col-12 col-md-6 text-center text-md-start text-white-50 small mb-2 mb-md-0">
                    &copy; 2025 John E. Parman. All rights reserved.
                </div>
                <div class="col-12 col-md-6 text-center text-md-end">
                    <a href="index.html" class="footer-link me-3">Home</a>
                    <a href="gallery.html" class="footer-link me-3">Gallery</a>
                    <a href="contact.html" class="footer-link me-3">Draw</a>
                    <a href="drawback.html" class="footer-link">Community</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmiFaVdMuNqzXMxBbqp3rVwCuLgzJTb" crossorigin="anonymous"></script>
    <script>
        const container = document.getElementById('galleryContainer');
        const gallery = JSON.parse(localStorage.getItem('myGallery') || '[]');

        if (gallery.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <p class="text-muted fs-5">No drawings yet.</p>
                    <a href="contact.html" class="btn btn-outline-primary mt-2">Be the first to draw!</a>
                </div>`;
        } else {
            gallery.forEach((imageStr, index) => {
                const col = document.createElement('div');
                col.className = 'col-12 col-sm-6 col-lg-4';
                col.innerHTML = `
                    <div class="card shadow-sm">
                        <img src="${imageStr}" class="card-img-top community-img" alt="Community drawing ${index + 1}">
                        <div class="card-body text-center">
                            <p class="text-muted small mb-0">Submission #${index + 1}</p>
                        </div>
                    </div>`;
                container.appendChild(col);
            });
        }
    </script>
</body>

</html>
