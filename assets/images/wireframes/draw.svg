<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580">
  <title>Draw a Message — Wireframe</title>
  <rect width="360" height="580" fill="#fff"/>
  <rect x="0" y="0" width="360" height="38" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="14" y="24" font-size="11" fill="#ecf0f1" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">JEP</text>
<text x="350" y="24" font-size="5.5" fill="#95a5a6" text-anchor="end" font-family="Arial,sans-serif" font-weight="normal">Home · About · Gallery · Draw · Bookmarks · Contact</text>
<rect x="0" y="38" width="360" height="52" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="180" y="60" font-size="14" fill="#ecf0f1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold">Draw a Message</text>
<text x="180" y="75" font-size="7.5" fill="#95a5a6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Select a colour and draw below</text>
<text x="180" y="103" font-size="7" fill="#666" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Drawing colour options</text>
<rect x="42" y="108" width="52" height="16" fill="#000000" stroke="none" stroke-width="1" rx="3"/>
<text x="68" y="117" font-size="6" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Black</text>
<rect x="98" y="108" width="52" height="16" fill="#E69F00" stroke="none" stroke-width="1" rx="3"/>
<text x="124" y="117" font-size="6" fill="#000" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Orange</text>
<rect x="154" y="108" width="52" height="16" fill="#56B4E9" stroke="none" stroke-width="1" rx="3"/>
<text x="180" y="117" font-size="6" fill="#000" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Sky Blue</text>
<rect x="210" y="108" width="52" height="16" fill="#009E73" stroke="none" stroke-width="1" rx="3"/>
<text x="236" y="117" font-size="6" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Green</text>
<rect x="266" y="108" width="52" height="16" fill="#eee" stroke="#aaa" stroke-width="1" rx="3"/>
<text x="292" y="117" font-size="6" fill="#000" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Clear</text>
<rect x="16" y="130" width="328" height="290" fill="#f9f9ff" stroke="#bbd" stroke-width="1" rx="3"/>
<text x="180" y="275" font-size="11" fill="#aab" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Drawing Canvas</text>
<text x="180" y="291" font-size="7.5" fill="#bbc" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal" font-style="italic">(mouse / touch to draw)</text>
<text x="180" y="438" font-size="7" fill="#666" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Submit to Community Gallery</text>
<rect x="120" y="444" width="120" height="20" fill="#2c3e50" stroke="none" stroke-width="1" rx="3"/>
<text x="180" y="457" font-size="7" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Submit Drawing</text>
<rect x="0" y="528" width="360" height="52" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="180" y="545" font-size="5.5" fill="#7f8c8d" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Home · Gallery · Draw · Community · Bookmarks · Story · Wireframe</text>
<text x="180" y="559" font-size="7" fill="#95a5a6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">© 2025 John E. Parman</text>
