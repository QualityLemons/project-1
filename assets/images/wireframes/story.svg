<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580">
  <title>A User Story — Wireframe</title>
  <rect width="360" height="580" fill="#fff"/>
  <rect x="0" y="0" width="360" height="38" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="14" y="24" font-size="11" fill="#ecf0f1" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">JEP</text>
<text x="350" y="24" font-size="5.5" fill="#95a5a6" text-anchor="end" font-family="Arial,sans-serif" font-weight="normal">Home · About · Gallery · Draw · Bookmarks · Contact</text>
<rect x="0" y="38" width="360" height="68" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="180" y="66" font-size="16" fill="#ecf0f1" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold">A User Story</text>
<text x="180" y="82" font-size="8" fill="#95a5a6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Accessibility & UX narrative</text>
<text x="180" y="94" font-size="7" fill="#7f8c8d" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Dr. Asha Mehta · Senior Lecturer</text>
<text x="16" y="118" font-size="7" fill="#b45309" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">The Persona</text>
<text x="16" y="130" font-size="9" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Meet Dr. Asha Mehta</text>
<rect x="16" y="138" width="328" height="68" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="2"/>
<rect x="20" y="142" width="32" height="32" fill="#dde4ee" stroke="#bbc" stroke-width="1" rx="16"/>
<text x="60" y="156" font-size="8" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Dr. Asha Mehta</text>
<text x="60" y="167" font-size="6.5" fill="#666" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">Senior Lecturer, Digital Media</text>
<text x="20" y="186" font-size="6" fill="#777" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">• Screen-reader user  • Tablet user  • Accessibility advocate</text>
<text x="20" y="197" font-size="6" fill="#777" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">• Goal: share portfolio with students and demonstrate good practice</text>
<text x="16" y="226" font-size="7" fill="#b45309" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Act One</text>
<text x="16" y="237" font-size="9" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">The Discovery</text>
<text x="16" y="249" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">Asha visits the site on a projector. Nav collapses</text>
<text x="16" y="260" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">on tablet — two labels vanish off screen edge.</text>
<text x="16" y="288" font-size="7" fill="#b45309" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Act Two</text>
<text x="16" y="299" font-size="9" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">The Problems</text>
<text x="16" y="311" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">6 issues logged: contrast, missing alt text,</text>
<text x="16" y="322" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">missing skip link, broken nav, no ARIA labels.</text>
<text x="16" y="350" font-size="7" fill="#b45309" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Act Three</text>
<text x="16" y="361" font-size="9" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">John Gets to Work</text>
<text x="16" y="373" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">Colour fixed to #b45309 (5.0:1). Alt text added.</text>
<text x="16" y="384" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">Skip link, ARIA roles, responsive nav all fixed.</text>
<text x="16" y="412" font-size="7" fill="#b45309" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">Act Four</text>
<text x="16" y="423" font-size="9" fill="#2c3e50" text-anchor="start" font-family="Arial,sans-serif" font-weight="bold">The Result</text>
<text x="16" y="435" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">Asha returns — site passes WCAG AA. Screen</text>
<text x="16" y="446" font-size="6.5" fill="#555" text-anchor="start" font-family="Arial,sans-serif" font-weight="normal">reader navigates cleanly. Students can access it.</text>
<rect x="0" y="528" width="360" height="52" fill="#2c3e50" stroke="none" stroke-width="1" rx="0"/>
<text x="180" y="545" font-size="5.5" fill="#7f8c8d" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">Home · Gallery · Draw · Community · Bookmarks · Story · Wireframe</text>
<text x="180" y="559" font-size="7" fill="#95a5a6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal">© 2025 John E. Parman</text>
</svg>
