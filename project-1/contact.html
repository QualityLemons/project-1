    <section class="container my-5">

        <div class="col-12 text-center">
            <h2 class="display-5">Draw a message</h2>
            <p>Select a colorblind-safe shade and draw your ideas below!</p>
        </div>
        
        <div class="col-md-8 mx-auto">
            <div class="d-flex justify-content-center mb-3 gap-2">
                <button class="btn color-btn" style="background:#000000; color:white" onclick="setColor('#000000')">Black</button>
                <button class="btn color-btn" style="background:#E69F00;" onclick="setColor('#E69F00')">Orange</button>
                <button class="btn color-btn" style="background:#56B4E9;" onclick="setColor('#56B4E9')">Sky Blue</button>
                <button class="btn color-btn" style="background:#009E73; color:white" onclick="setColor('#009E73')">Green</button>
                <button class="btn btn-outline-danger" onclick="clearCanvas()">Clear</button>
            </div>

            <canvas id="drawingCanvas" width="600" height="400" style="border:2px solid #333; background:#fff; width:100%; cursor:crosshair;"></canvas>
            
            <div class="text-center mt-3">
                <button class="btn btn-primary btn-lg" onclick="saveDrawing()">Submit to Gallery</button>
            </div>
        </div>
    </div>
</section>

<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let color = "#000000";

    // Setup Canvas
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    function setColor(newColor) { color = newColor; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function startPos(e) { painting = true; draw(e); }
    function endPos() { painting = false; ctx.beginPath(); }

    function draw(e) {
        if (!painting) return;
        ctx.strokeStyle = color;

        // Handle mouse or touch position
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPos);
    canvas.addEventListener('mouseup', endPos);
    canvas.addEventListener('mousemove', draw);

    // LocalStorage Save Function
    function saveDrawing() {
        const dataURL = canvas.toDataURL(); // Converts drawing to a string
        const gallery = JSON.parse(localStorage.getItem('myGallery') || '[]');
        gallery.push(dataURL);
        localStorage.setItem('myGallery', JSON.stringify(gallery));
        
        alert("Drawing saved! View it in your gallery.");
        window.location.href = "drawback.html"; 
    }
</script>
